{% extends 'base.html' %}

{% block title %}Вход в систему{% endblock %}

{% block content %}
    <h2>Вхід у систему</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Войти</button>
    </form>
    <p style="margin-top: 16px; font-size: 0.9rem; color: var(--olive);">
        Нет аккаунта? <a href="{% url 'register' %}" style="color: var(--terracotta); font-weight: 600;">Зарегистрироваться</a>
    </p>
{% endblock %}
