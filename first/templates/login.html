{% extends 'base.html' %}

{% block title %}Log In{% endblock %}

{% block content %}
    <h2>Log In</h2>
    <form method="post">
        {% csrf_token %}
        {{ form.as_p }}
        <button type="submit" class="btn-primary">Log In</button>
    </form>
    <p style="margin-top: 16px; font-size: 0.9rem; color: var(--olive);">
        Don't have an account? <a href="{% url 'register' %}" style="color: var(--terracotta); font-weight: 600;">Register</a>
    </p>
{% endblock %}
